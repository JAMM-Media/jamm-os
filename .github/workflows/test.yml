name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/test_db
      SECRET_KEY: super-secret-ci-key
      ALGORITHM: HS256
      STRIPE_WEBHOOK_SECRET: whsec_dummy_value_for_ci_only
      STRIPE_SECRET_KEY: sk_test_dummy_value_for_ci_only

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Verify imports
        run: |
          python -c "from app.main import app; print('App imports OK')"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
